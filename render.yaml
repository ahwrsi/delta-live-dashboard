services:
  - type: web
    name: delta-live-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEFAULT_SYMBOL
        value: ETHUSD
      - key: DEFAULT_TIMEFRAME
        value: 5m
      - key: UPDATE_INTERVAL
        value: "60"
      - key: LOOKBACK_HOURS
        value: "24"
      - key: LEVEL_COUNT
        value: "3"
      - key: TIMEZONE
        value: Asia/Kolkata
